<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfferHub — Global Offers</title><style>body{margin:0;background:#070b14;color:#eef2ff;font:14px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:42px;margin:12px 0}.sub{color:#9aa7bf}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}select,input,button{padding:12px;border-radius:10px;border:1px solid #27334d;background:#10182a;color:#fff}button{cursor:pointer}.primary{background:#6d5dfc;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#0d1423;border:1px solid #1d2940;border-radius:18px;padding:20px}.icon{font-size:34px}.tag{display:inline-block;color:#aab5ff;margin:8px 0}.card a{display:block;text-align:center;background:#6d5dfc;color:white;text-decoration:none;padding:12px;border-radius:10px;margin-top:16px}.admin{position:fixed;right:16px;bottom:16px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center}.modal.open{display:flex}.box{background:#0d1423;border:1px solid #27334d;border-radius:18px;padding:24px;width:min(560px,90vw)}.box input,.box textarea{width:100%;box-sizing:border-box;margin:7px 0}.item{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #243047;padding:12px 0}.danger{background:#3a1620}</style></head><body><main><div class="sub">GLOBAL CPA / CPL MARKETPLACE</div><h1>Find offers made for your country.</h1><p class="sub">Select your country to see active offers available in your market.</p><div class="bar"><select id="country" onchange="loadOffers()"><option value="">🌍 All countries</option><option>US</option><option>CA</option><option>GB</option><option>AU</option><option>DE</option><option>FR</option><option>ES</option><option>IT</option><option>NL</option><option>SE</option><option>NO</option><option>DK</option><option>IN</option><option>BD</option><option>PK</option><option>AE</option><option>SA</option><option>SG</option><option>MY</option><option>PH</option><option>BR</option><option>MX</option></select><button onclick="loadOffers()">Refresh offers</button></div><div id="offers" class="grid"></div></main><div class="admin"><button onclick="openAdmin()">⚙ Admin</button></div><div id="adminModal" class="modal"><div class="box"><button onclick="closeAdmin()">✕</button><div id="loginView"><h3>Admin login</h3><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in</button><p id="msg"></p></div><div id="dash" style="display:none"><h3>Manage offers</h3><input id="oid" type="hidden"><input id="name" placeholder="Offer name"><input id="icon" placeholder="Icon" value="🎁"><input id="type" placeholder="Type (Lead, Install, Submit...)" value="Lead"><input id="countries" placeholder="Countries: US,GB or GLOBAL"><input id="url" placeholder="Tracking URL"><textarea id="desc" placeholder="Description" rows="3"></textarea><div class="bar"><button class="primary" onclick="saveOffer()">Save offer</button><button onclick="resetForm()">Clear</button><button onclick="logout()">Logout</button></div><div id="items"></div></div></div></div><script>const $=id=>document.getElementById(id);function openAdmin(){$('adminModal').classList.add('open');fetch('/api/me').then(r=>r.json()).then(x=>x.authenticated?showDash():showLogin())}function closeAdmin(){$('adminModal').classList.remove('open')}function showLogin(){$('loginView').style.display='block';$('dash').style.display='none'}function showDash(){$('loginView').style.display='none';$('dash').style.display='block';adminList()}async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});if(r.ok)showDash();else $('msg').textContent='Invalid username or password.'}async function logout(){await fetch('/api/logout',{method:'POST'});showLogin()}async function loadOffers(){let c=$('country').value;let r=await fetch('/api/offers?country='+encodeURIComponent(c));let a=await r.json();$('offers').innerHTML=a.length?a.map(o=>`<div class="card"><div class="icon">${esc(o.icon)}</div><h2>${esc(o.name)}</h2><div class="tag">${esc(o.type)}</div><p class="sub">${esc(o.description)}</p><a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">Get offer →</a></div>`).join(''):'<p class="sub">No active offers found for this country yet.</p>'}async function adminList(){let r=await fetch('/api/admin/offers');if(!r.ok)return;let a=await r.json();$('items').innerHTML=a.map(o=>`<div class="item"><span><b>${esc(o.icon)} ${esc(o.name)}</b><br><small>${esc(o.type)} · ${esc(o.countries.join(', '))}</small></span><span><button onclick='editOffer(${JSON.stringify(o)})'>Edit</button><button class="danger" onclick="deleteOffer(${o.id})">Remove</button></span></div>`).join('')}async function saveOffer(){let body={name:$('name').value,icon:$('icon').value,type:$('type').value,countries:$('countries').value,description:$('desc').value,url:$('url').value};let id=$('oid').value;let r=await fetch(id?'/api/admin/offers/'+id:'/api/admin/offers',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){alert((await r.json()).error||'Could not save');return}resetForm();adminList();loadOffers()}function editOffer(o){$('oid').value=o.id;$('name').value=o.name;$('icon').value=o.icon;$('type').value=o.type;$('countries').value=o.countries.join(',');$('url').value=o.url;$('desc').value=o.description}function resetForm(){['oid','name','countries','url','desc'].forEach(id=>$(id).value='');$('icon').value='🎁';$('type').value='Lead'}async function deleteOffer(id){if(!confirm('Remove this offer?'))return;await fetch('/api/admin/offers/'+id,{method:'DELETE'});adminList();loadOffers()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}loadOffers();</script></body></html>
